{{template "partials/top" .}} {{template "partials/navbar" .}}
<main class="container">
  <a href="device_mac.html">Device Mac association</a>
  <div id="treeview">{{.tree}}</div>
  <div style="width:1440px; margin: 0 auto;">
    <img src="{{.networkImage}}" alt="Network Diagram" width="100%" height="100%">
  </div>
</main>

<dialog id="popEdit">
  <article>
    <header>
      <button type='button' aria-label="Close" rel="prev" data-target="popEdit" onclick="toggleModal(event);"></button>
      <h4 id="name">Device Name</h4>
    </header>
    <form id="theForm" name="theForm" onsubmit="return false;" action="#" method="post" autocomplete="off">
      <input type="hidden" id="cid" name="cid" value="">
      <label for='kind'><span id="iKind">{{.devicesIcon}}</span > Kind</label>
      {{.kindCtrl}}
      <label for='office'>{{.officeIcon}} Office</label>
      {{.officeCtrl}}
      <label for='parent'><span id="iParent">{{.parentIcon}}</span> Parent</label>
      {{.parentCtrl}}
    </form>
    <footer>
      <button role="button" class="outline" data-target="popEdit" onclick="toggleModal(event);">Cancel</button>
      <button role="button" for="theForm" data-target="popEdit"  onclick="saveDetail();">Save</button>
    </footer>
  </article>
</dialog>

<dialog id="siteSelect">
  <article>
    <header>
        <button type='button' aria-label="Close" rel="prev" data-target="siteSelect" onclick="toggleModal(event)"></button>
        <h3>Network</h3>
    </header>
    <section>
      Select a site
      {{.siteCtrl}}
    </section>
    <footer>
      <button role="button" class="outline" data-target="siteSelect" onclick="toggleModal(event);">Cancel</button>
      <button type='button' data-target="siteSelect" onclick="newSiteSelected();toggleModal(event)">Okay</button>
    </footer>
  </article>
</dialog>

<dialog id="helpDialog">
  <article>
    <header>
        <button type='button' aria-label="Close" rel="prev" data-target="helpDialog" onclick="toggleModal(event)"></button>
        <h3>Network</h3>
    </header>
    <section>
      Network Diagram
    </section>
    <footer>
      <button type='button' data-target="helpDialog" onclick="toggleModal(event)">Okay</button>
    </footer>
  </article>
</dialog>

<script src="js/network.js" defer></script>
{{template "partials/bottom" .}}
